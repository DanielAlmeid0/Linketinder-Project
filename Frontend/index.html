<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linketinder</title>
  </head>
  <body>
    <header>
      <h1>Linketinder</h1>
      <nav>
        <button data-tela="cadastro-candidato">Cadastro Candidato</button>
        <button data-tela="cadastro-empresa">Cadastro Empresa</button>
        <button data-tela="perfil-candidato">Perfil Candidato</button>
        <button data-tela="perfil-empresa">Perfil Empresa</button>
      </nav>
    </header>

    <main>
      <section id="cadastro-candidato" class="tela">
        <h2>Cadastro de Candidato</h2>
        <form id="form-candidato">
          <input name="nome" placeholder="Nome" />
          <input name="sobrenome" placeholder="Sobrenome" />
          <input name="email" type="email" placeholder="E-mail" />
          <input name="cpf" placeholder="CPF" />
          <input name="dataNascimento" type="date" />
          <input name="estado" placeholder="Estado (ex.: CE)" />
          <input name="cep" placeholder="CEP" />
          <input name="formacao" placeholder="Formação" />
          <textarea name="descricao" placeholder="Descrição pessoal"></textarea>
          <fieldset>
            <legend>Competências</legend>
            <div class="competencias"></div>
          </fieldset>
          <button type="submit">Cadastrar</button>
        </form>
      </section>

      <section id="cadastro-empresa" class="tela" hidden>
        <h2>Cadastro de Empresa</h2>
        <form id="form-empresa">
          <input name="nome" placeholder="Nome da empresa" />
          <input name="email" type="email" placeholder="E-mail corporativo" />
          <input name="cnpj" placeholder="CNPJ" />
          <input name="pais" placeholder="País" />
          <input name="estado" placeholder="Estado" />
          <input name="cep" placeholder="CEP" />
          <textarea name="descricao" placeholder="Descrição da empresa"></textarea>
          <button type="submit">Cadastrar</button>
        </form>
      </section>

      <section id="perfil-candidato" class="tela" hidden>
        <h2>Vagas disponíveis</h2>
        <div id="lista-vagas"></div>
      </section>

      <section id="perfil-empresa" class="tela" hidden>
        <h2>Candidatos (anônimos)</h2>
        <div id="lista-candidatos"></div>
        <h2>Candidatos por competência</h2>
        <div class="grafico"><canvas id="grafico-competencias"></canvas></div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
